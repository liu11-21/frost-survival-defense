name: Gameplay Interaction Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/scene-interaction-rework.spec.ts"
      - "tests/localization-v1.spec.ts"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.ts"
      - ".github/workflows/gameplay-interaction-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gameplay-interaction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Real pointer recruit and menu regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/gameplay-interaction-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/gameplay-interaction-preview.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/gameplay-interaction-preview.log"
          exit 1

      - name: Pointer recruit drag and localization regression
        run: |
          mkdir -p .runtime/g1-evidence .runtime/localization-v1
          npx playwright test tests/scene-interaction-rework.spec.ts tests/localization-v1.spec.ts

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-interaction-verification-${{ github.run_id }}
          path: |
            .runtime/g1-evidence/
            .runtime/localization-v1/
            test-results/
            ${{ runner.temp }}/gameplay-interaction-preview.log
          if-no-files-found: warn
