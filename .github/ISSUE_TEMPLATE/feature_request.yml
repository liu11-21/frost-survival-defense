name: Feature request
description: Propose a focused improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / player need
      description: What problem does this solve or what experience does it improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful version first.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay / balance
        - Scene / map
        - UI / interaction
        - Character / art
        - Audio
        - Build / CI / tooling
        - Documentation
        - Other
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs / alternatives
      description: Optional constraints, alternatives, performance implications, or references.
