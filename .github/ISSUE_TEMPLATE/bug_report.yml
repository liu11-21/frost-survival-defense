name: Bug report
description: Report a reproducible problem in Frostbound Furnace
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not post credentials or security vulnerabilities here; use SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start ...\n2. Build ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / version
      placeholder: "main @ SHA or deployed version"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay / balance
        - Scene / map
        - UI / interaction
        - Character / art
        - Audio
        - Build / CI / tooling
        - Other
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, console output, or a minimal reproduction when useful. Remove private data first.
